# This file must be kept secret and not committed to version control.
# To use this:
# 1. Generate a keystore file: keytool -genkey -v -keystore ~/android_keystore.jks -keyalg RSA -keysize 2048 -validity 10000 -alias tasteway_key
# 2. Fill in the paths and passwords below
# 3. Add this file to .gitignore

storeFile=/path/to/your/android_keystore.jks
storePassword=your_store_password
keyAlias=tasteway_key
keyPassword=your_key_password
