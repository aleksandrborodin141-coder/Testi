# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check the documentation for more details.
# For more details on how to configure your build environment visit
# https://www.gradle.org/configure-build-environment

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines running CI builds following the
# https://gradle.org/get-started/#configure-the-build-environment-variables
# Gradle "lean" tasks can use this to save memory when running builds.
org.gradle.jvmargs=-Xmx4096m -XX:MaxPermSize=4096m

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it easier to support AndroidX in your project.
android.useAndroidX=true

# Flutter-related properties
flutter.sdk=/path/to/flutter
flutter.minSdkVersion=21
flutter.targetSdkVersion=34
flutter.compileSdkVersion=34

# Kotlin language level
kotlin.code.style=official
