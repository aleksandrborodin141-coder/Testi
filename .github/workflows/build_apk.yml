name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Setup Flutter 3.24.0
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Create Flutter project
      run: |
        flutter create tasteway --org com.tasteway --project-name tasteway

    - name: Update Gradle wrapper
      run: |
        cd tasteway/android
        ./gradlew wrapper --gradle-version 8.5 || true
        sed -i 's/gradle-[0-9.]*-all.zip/gradle-8.5-all.zip/' gradle/wrapper/gradle-wrapper.properties
        cat gradle/wrapper/gradle-wrapper.properties

    - name: Copy source files (NO android/)
      run: |
        unzip tasteway_flutter_with_key.zip -d source_zip
        cp -r source_zip/lib/* tasteway/lib/
        cp source_zip/pubspec.yaml tasteway/pubspec.yaml

    - name: Fix pubspec.yaml
      run: |
        sed -i 's/yandex_mapkit: \^4.4.0/yandex_mapkit: ^4.3.0/' tasteway/pubspec.yaml

    - name: Fix Kotlin DSL build config
      run: |
        python3 << 'PYEOF'
        import os
        kts_file = 'tasteway/android/app/build.gradle.kts'
        if os.path.exists(kts_file):
            with open(kts_file, 'r') as f:
                content = f.read()
            content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
            content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
            content = content.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')
            with open(kts_file, 'w') as f:
                f.write(content)
            print("Fixed build.gradle.kts")
            print(content[:800])
        else:
            print("ERROR: build.gradle.kts not found!")
            exit(1)
        PYEOF

    - name: Add permissions to AndroidManifest
      run: |
        sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' tasteway/android/app/src/main/AndroidManifest.xml

    - name: Create assets folders
      run: |
        mkdir -p tasteway/assets/images tasteway/assets/fonts

    - name: Get dependencies
      run: |
        cd tasteway
        flutter pub get

    - name: Build APK
      run: |
        cd tasteway
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TasteWay-APK
        path: tasteway/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
