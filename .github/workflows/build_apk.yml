name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter 3.24.0
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Create Flutter project
      run: |
        flutter create tasteway --org com.tasteway --project-name tasteway

    - name: Show build.gradle BEFORE fix
      run: |
        echo "=== Files in android/app ==="
        ls -la tasteway/android/app/
        echo "=== build.gradle content ==="
        cat tasteway/android/app/build.gradle 2>/dev/null || echo "No build.gradle"
        echo "=== build.gradle.kts content ==="
        cat tasteway/android/app/build.gradle.kts 2>/dev/null || echo "No build.gradle.kts"

    - name: Unzip and copy source files
      run: |
        unzip tasteway_flutter_with_key.zip -d source_zip
        cp -r source_zip/lib/* tasteway/lib/
        cp source_zip/pubspec.yaml tasteway/pubspec.yaml

    - name: Fix pubspec.yaml
      run: |
        sed -i 's/yandex_mapkit: \^4.4.0/yandex_mapkit: ^4.3.0/' tasteway/pubspec.yaml

    - name: Fix Android build config
      run: |
        python3 << 'PYEOF'
        import os
        
        gradle_file = None
        if os.path.exists('tasteway/android/app/build.gradle.kts'):
            gradle_file = 'tasteway/android/app/build.gradle.kts'
            print("Found build.gradle.kts")
        elif os.path.exists('tasteway/android/app/build.gradle'):
            gradle_file = 'tasteway/android/app/build.gradle'
            print("Found build.gradle")
        else:
            print("ERROR: No build.gradle found!")
            exit(1)
        
        with open(gradle_file, 'r') as f:
            content = f.read()
        
        print("=== BEFORE ===")
        print(content)
        
        if gradle_file.endswith('.kts'):
            content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 34')
            content = content.replace('minSdk = flutter.minSdkVersion', 'minSdk = 21')
            content = content.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 34')
        else:
            content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 34')
            content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdkVersion 21')
            content = content.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdkVersion 34')
        
        with open(gradle_file, 'w') as f:
            f.write(content)
        
        print("=== AFTER ===")
        with open(gradle_file, 'r') as f:
            print(f.read())
        PYEOF

    - name: Add permissions to AndroidManifest
      run: |
        sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' tasteway/android/app/src/main/AndroidManifest.xml

    - name: Create assets folders
      run: |
        mkdir -p tasteway/assets/images tasteway/assets/fonts

    - name: Get dependencies
      run: |
        cd tasteway
        flutter pub get

    - name: Build APK
      run: |
        cd tasteway
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TasteWay-APK
        path: tasteway/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
