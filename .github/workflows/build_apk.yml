name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      - name: Extract project
        run: |
          unzip tasteway_flutter_with_key.zip -d .
          ls -la

      - name: Find project
        run: |
          find . -name pubspec.yaml

      - name: Get packages
        run: |
          cd tasteway_flutter_with_key
          flutter clean
          flutter pub get

      - name: Build APK
        run: |
          cd tasteway_flutter_with_key
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TasteWay-APK
          path: tasteway_flutter_with_key/build/app/outputs/flutter-apk/app-release.apk
