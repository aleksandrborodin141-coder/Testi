name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Extract project
        run: |
          unzip tasteway_flutter_with_key.zip -d project
          find project -name pubspec.yaml

      - name: Fix dependencies
        run: |
          cd project
          sed -i 's/yandex_mapkit: \^4.4.0/yandex_mapkit: ^4.3.0/' pubspec.yaml
          grep yandex_mapkit pubspec.yaml

      - name: Get dependencies
        run: |
          cd project
          flutter pub get

      - name: Fix Android embedding
  run: |
    cd project

    python3 << 'PYEOF'
    from pathlib import Path

    manifest = Path("android/app/src/main/AndroidManifest.xml")

    if manifest.exists():
        text = manifest.read_text()

        text = text.replace(
            "io.flutter.app.FlutterApplication",
            "android.app.Application"
        )

        manifest.write_text(text)

    PYEOF


- name: Build APK
  run: |
    cd project
    flutter clean
    flutter pub get
    flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TasteWay-APK
          path: project/build/app/outputs/flutter-apk/app-release.apk
