name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Create Flutter project
      run: |
        flutter create tasteway --org com.tasteway --project-name tasteway

    - name: Remove Kotlin DSL files
      run: |
        find tasteway/android -name "*.kts" -type f -delete
        ls -la tasteway/android/

    - name: Create settings.gradle
      run: |
        cat > tasteway/android/settings.gradle << 'SETT'
        pluginManagement {
            def flutterSdkPath = {
                def properties = new Properties()
                file("local.properties").withInputStream { properties.load(it) }
                def flutterSdkPath = properties.getProperty("flutter.sdk")
                assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                return flutterSdkPath
            }()
            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        plugins {
            id "dev.flutter.flutter-plugin-loader" version "1.0.0"
            id "com.android.application" version "8.1.0" apply false
            id "org.jetbrains.kotlin.android" version "1.8.22" apply false
        }
        include ":app"
        SETT

    - name: Create root build.gradle
      run: |
        cat > tasteway/android/build.gradle << 'ROOT'
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        ROOT

    - name: Unzip and copy source files
      run: |
        unzip tasteway_flutter_with_key.zip -d source_zip
        cp -r source_zip/lib/* tasteway/lib/
        cp source_zip/android/app/src/main/AndroidManifest.xml tasteway/android/app/src/main/AndroidManifest.xml

    - name: Fix pubspec.yaml
      run: |
        cd tasteway
        sed -i 's/yandex_mapkit: \^4.4.0/yandex_mapkit: ^4.3.0/' pubspec.yaml
        grep -q "dio:" pubspec.yaml || sed -i '/cupertino_icons:/a\  dio: ^5.4.0' pubspec.yaml
        grep -q "flutter_bloc:" pubspec.yaml || sed -i '/cupertino_icons:/a\  flutter_bloc: ^8.1.3' pubspec.yaml
        grep -q "equatable:" pubspec.yaml || sed -i '/cupertino_icons:/a\  equatable: ^2.0.5' pubspec.yaml
        grep -q "shared_preferences:" pubspec.yaml || sed -i '/cupertino_icons:/a\  shared_preferences: ^2.2.2' pubspec.yaml
        grep -q "geolocator:" pubspec.yaml || sed -i '/cupertino_icons:/a\  geolocator: ^10.1.0' pubspec.yaml
        grep -q "url_launcher:" pubspec.yaml || sed -i '/cupertino_icons:/a\  url_launcher: ^6.2.2' pubspec.yaml
        grep -q "yandex_mapkit:" pubspec.yaml || sed -i '/cupertino_icons:/a\  yandex_mapkit: ^4.3.0' pubspec.yaml

    - name: Create app build.gradle
      run: |
        cat > tasteway/android/app/build.gradle << 'APP'
        plugins {
            id "com.android.application"
            id "kotlin-android"
            id "dev.flutter.flutter-gradle-plugin"
        }
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader('UTF-8') { reader ->
                localProperties.load(reader)
            }
        }
        def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
        if (flutterVersionCode == null) {
            flutterVersionCode = '1'
        }
        def flutterVersionName = localProperties.getProperty('flutter.versionName')
        if (flutterVersionName == null) {
            flutterVersionName = '1.0.0'
        }
        android {
            namespace = "com.tasteway.app"
            compileSdk = 34
            ndkVersion = flutter.ndkVersion
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            sourceSets {
                main.java.srcDirs += 'src/main/kotlin'
            }
            defaultConfig {
                applicationId "com.tasteway.app"
                minSdk = 21
                targetSdk = 34
                versionCode flutterVersionCode.toInteger()
                versionName flutterVersionName
            }
            buildTypes {
                release {
                    signingConfig signingConfigs.debug
                    minifyEnabled false
                    shrinkResources false
                }
            }
        }
        flutter {
            source '../..'
        }
        APP

    - name: Create assets folders
      run: |
        mkdir -p tasteway/assets/images tasteway/assets/fonts

    - name: Get dependencies
      run: |
        cd tasteway
        flutter pub get

    - name: Build APK
      run: |
        cd tasteway
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TasteWay-APK
        path: tasteway/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
