name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Unzip project
      run: |
        unzip tasteway_flutter_with_key.zip -d tasteway_project
        ls -la tasteway_project/

    - name: Fix yandex_mapkit version
      run: |
        cd tasteway_project
        sed -i 's/yandex_mapkit: \^4.4.0/yandex_mapkit: ^4.3.0/' pubspec.yaml

    - name: Fix Android V2 embedding
      run: |
        cd tasteway_project
        sed -i 's/android:name="io.flutter.app.FlutterApplication"/android:name="${applicationName}"/' android/app/src/main/AndroidManifest.xml
        mkdir -p android/app/src/main/kotlin/com/example/tasteway
        echo 'package com.example.tasteway' > android/app/src/main/kotlin/com/example/tasteway/MainActivity.kt
        echo '' >> android/app/src/main/kotlin/com/example/tasteway/MainActivity.kt
        echo 'import io.flutter.embedding.android.FlutterActivity' >> android/app/src/main/kotlin/com/example/tasteway/MainActivity.kt
        echo '' >> android/app/src/main/kotlin/com/example/tasteway/MainActivity.kt
        echo 'class MainActivity: FlutterActivity()' >> android/app/src/main/kotlin/com/example/tasteway/MainActivity.kt

    - name: Get dependencies
      run: |
        cd tasteway_project
        flutter pub get

    - name: Build APK
      run: |
        cd tasteway_project
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TasteWay-APK
        path: tasteway_project/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

        
