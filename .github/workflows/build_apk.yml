name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Flutter 3.24.0
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'

    - name: Create Flutter project
      run: |
        flutter create tasteway --org com.tasteway --project-name tasteway

    - name: Unzip and copy source files
      run: |
        unzip tasteway_flutter_with_key.zip -d source_zip
        cp -r source_zip/lib/* tasteway/lib/
        cp source_zip/pubspec.yaml tasteway/pubspec.yaml

    - name: Fix pubspec.yaml
      run: |
        sed -i 's/yandex_mapkit: \^4.4.0/yandex_mapkit: ^4.3.0/' tasteway/pubspec.yaml

    - name: Fix Android build config with sed
      run: |
        sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 34/' tasteway/android/app/build.gradle
        sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/' tasteway/android/app/build.gradle
        sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' tasteway/android/app/build.gradle
        echo "=== Fixed values ==="
        grep -E "compileSdk|minSdk|targetSdk" tasteway/android/app/build.gradle

    - name: Add permissions to AndroidManifest
      run: |
        sed -i '/<\/manifest>/i\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' tasteway/android/app/src/main/AndroidManifest.xml

    - name: Create assets folders
      run: |
        mkdir -p tasteway/assets/images tasteway/assets/fonts

    - name: Get dependencies
      run: |
        cd tasteway
        flutter pub get

    - name: Build APK
      run: |
        cd tasteway
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TasteWay-APK
        path: tasteway/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30
